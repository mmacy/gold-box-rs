# Reject game data anywhere in the repository's history, on every push and pull request.
name: game-data
on:
  push:
  pull_request:
jobs:
  game-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/check_game_data.py commits --all
